spring.application.name=campusflow-backend
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusflow_db}
spring.datasource.username=${DB_USERNAME:campusflow_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Base64-encoded random key with at least 32 bytes; no signing-key default.
campusflow.security.jwt-secret=${JWT_SECRET}
campusflow.security.issuer=${JWT_ISSUER:campusflow}
campusflow.security.audience=${JWT_AUDIENCE:campusflow-api}
campusflow.security.access-seconds=${JWT_ACCESS_SECONDS:900}
campusflow.security.refresh-days=${REFRESH_TOKEN_DAYS:7}
campusflow.security.cors-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Authentication bodies/tokens must never appear in diagnostic output.
spring.mvc.log-request-details=false
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
spring.test.mockmvc.print=none
# Avoid database constraint/bind diagnostics containing credential hashes or token material.
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
